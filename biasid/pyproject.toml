[project]
name = "biasid"
version = "1.0.0"
description = "biasid - a tool for analyzing transformation bias and robustness of AI-generated image detectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.0",
    "pandas>=3.0.0",
    "pillow>=12.1.0",
    "scienceplots>=2.2.1",
    "torch>=2.10.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
fix = true
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
extend-ignore = ["E402"]
